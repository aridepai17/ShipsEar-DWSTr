name: ShipsEar-DWSTr CI Pipeline

on:
    push:
        branches: ["master", "main"]
    pull_request:
        branches: ["master", "main"]

jobs:
    format-and-lint:
        name: Check Prettier Formatting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install Root Dependencies
              run: npm install

            - name: Run Prettier Check
              run: npx prettier --check "frontend/**/*.{js,jsx,ts,tsx,json,css}" "*.md"

    build-frontend:
        name: Build Next.js Frontend
        runs-on: ubuntu-latest
        needs: format-and-lint
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install Frontend Dependencies
              working-directory: ./frontend
              run: npm install

            - name: Build Next.js App
              working-directory: ./frontend
              run: npm run build

    check-backend:
        name: Verify FastAPI Backend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install Backend Dependencies
              working-directory: ./backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Dry Run API Start
              working-directory: ./backend
              run: python -c "from app.main import app; print('Backend loaded successfully.')"
